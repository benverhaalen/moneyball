name: Bug report
description: Report a reproducible problem using synthetic or redacted evidence.
body:
  - type: textarea
    id: journey
    attributes:
      label: User journey and observed behavior
      description: What were you trying to do, and what happened? Exclude private IDs and credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected behavior
      description: Include a small synthetic fixture or redacted command and error.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python, operating system and Moneyball version
